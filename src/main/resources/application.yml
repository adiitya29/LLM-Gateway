server:
  port: 8080

spring:
  application:
    name: llm-gateway

  # Reactive R2DBC Configuration
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:llmgateway}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  # Flyway Migrations (runs synchronously on startup via JDBC)
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:llmgateway}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Reactive Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Gateway Master Configuration
gateway:
  admin:
    master-key: ${GATEWAY_MASTER_KEY:dev-admin-key}
  upstream:
    base-url: ${UPSTREAM_BASE_URL:http://localhost:8089/v1}
    api-key: ${UPSTREAM_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 60000

  # Resilience & Circuit Breakers
  circuit-breaker:
    failure-rate-threshold: 50.0
    sliding-window-size: 10
    minimum-number-of-calls: 5
    wait-duration-in-open-state-seconds: 10
    permitted-number-of-calls-in-half-open-state: 3

  # Multi-Tier Caching (Redis Exact + pgvector Semantic)
  cache:
    enabled: true
    exact-ttl-seconds: 3600
    semantic-ttl-seconds: 86400
    semantic-similarity-threshold: 0.95
    max-temperature-for-semantic: 0.2
    embedding-provider: ${EMBEDDING_PROVIDER:gemini}
    embedding-model: text-embedding-004

  # Upstream Providers
  providers:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      api-key: ${GEMINI_API_KEY:}
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
    groq:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${GROQ_API_KEY:}
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      connect-timeout-ms: 5000
      read-timeout-ms: 30000

  # Model Alias Routing
  routes:
    fast-chat:
      description: "Ultra-fast low-latency chat"
      targets:
        - provider: groq
          model: openai/gpt-oss-120b
        - provider: gemini
          model: gemini-1.5-flash
    smart-chat:
      description: "High-reasoning smart chat"
      targets:
        - provider: groq
          model: openai/gpt-oss-120b
        - provider: gemini
          model: gemini-1.5-flash
    gemini-flash:
      description: "Google Gemini 1.5 Flash"
      targets:
        - provider: gemini
          model: gemini-1.5-flash
    gpt-4o-mini:
      description: "OpenAI GPT-4o Mini"
      targets:
        - provider: openai
          model: gpt-4o-mini
        - provider: gemini
          model: gemini-1.5-flash

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: llm-gateway
    distribution:
      percentiles-histogram:
        llm_gateway_latency_seconds: true
        llm_gateway_time_to_first_token_seconds: true
      sla:
        llm_gateway_latency_seconds: 100ms, 250ms, 500ms, 1s, 2s, 5s
        llm_gateway_time_to_first_token_seconds: 50ms, 100ms, 200ms, 500ms, 1s

