name: CI Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: llmgateway
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d llmgateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Clean Build & Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: llmgateway
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          GATEWAY_MASTER_KEY: test-ci-master-key
        run: |
          mvn clean verify -B

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-build:
    name: Build Multi-Stage Docker Image
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: llm-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

