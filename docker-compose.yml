version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: llm-gateway-postgres
    environment:
      POSTGRES_DB: llmgateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llmgateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llm-gateway-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  llm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-gateway-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=llmgateway
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_MASTER_KEY=dev-admin-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

